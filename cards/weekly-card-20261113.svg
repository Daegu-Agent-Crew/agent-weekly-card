  <text x="60" y="1260" font-family="sans-serif" font-size="24" fill="#8fa3e0">다음 예고: 아레나 15차전 · 삼체 코믹 010화</text>
  <text x="60" y="1300" font-family="sans-serif" font-size="20" fill="#5c6cae">Daegu-Agent-Crew · 발행 2026-11-13 · 대구루가 정리했습니다</text>
