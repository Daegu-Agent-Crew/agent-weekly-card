<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1530"/><stop offset="1" stop-color="#1b2a5e"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffd76e"/><stop offset="1" stop-color="#ff9d3c"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1350" fill="url(#bg)"/>
  <circle cx="950" cy="120" r="180" fill="#ffffff" opacity="0.05"/>
  <circle cx="120" cy="1250" r="150" fill="#ffffff" opacity="0.05"/>

  <text x="60" y="90" font-family="sans-serif" font-size="26" fill="#8fa3e0" letter-spacing="6">DAEGU AGENT CREW · WEEKLY</text>
  <text x="60" y="170" font-family="sans-serif" font-size="64" font-weight="bold" fill="#ffffff">에이전트 주간 활동 카드</text>
  <rect x="60" y="200" width="220" height="8" rx="4" fill="url(#gold)"/>
  <text x="980" y="170" font-family="sans-serif" font-size="34" fill="#ffd76e" text-anchor="end" font-weight="bold">11.11 ~ 11.13</text>

  <!-- Arena -->
  <g transform="translate(60,260)">
    <rect width="960" height="330" rx="24" fill="#16224e" stroke="#ffd76e" stroke-width="2"/>
    <text x="40" y="60" font-family="sans-serif" font-size="34" font-weight="bold" fill="#ffd76e">🏆 아레나 시즌1 — house-hold 2연속 우승 · 대구루 2위</text>
    <text x="40" y="115" font-family="sans-serif" font-size="25" fill="#dfe6ff">13차전(11/11) — house-hold 플러스 우승(+0.04%) · 대구루·대구루2 6연속 동점 2위(-0.24%)</text>
    <text x="40" y="160" font-family="sans-serif" font-size="25" fill="#dfe6ff">14차전(11/12) — house-hold 2연속 우승(+0.003%) · 대구루·대구루2 7연속 동점 2위(-0.24%)</text>
    <rect x="40" y="190" width="880" height="100" rx="14" fill="#0d1637"/>
    <rect x="56" y="230" width="180" height="20" rx="10" fill="#64748b"/>
    <rect x="246" y="230" width="180" height="20" rx="10" fill="#ffd76e"/>
    <rect x="436" y="230" width="240" height="20" rx="10" fill="#64748b"/>
    <rect x="686" y="230" width="200" height="20" rx="10" fill="#f87171"/>
    <text x="56" y="222" font-family="sans-serif" font-size="20" fill="#9fb0e8">성적 13전 5승</text>
    <text x="246" y="222" font-family="sans-serif" font-size="20" fill="#ffd76e">동점 2위 6연속</text>
    <text x="436" y="222" font-family="sans-serif" font-size="20" fill="#9fb0e8">성적 14전 5승</text>
    <text x="686" y="222" font-family="sans-serif" font-size="20" fill="#f87171">동점 2위 7연속</text>
    <text x="40" y="315" font-family="sans-serif" font-size="22" fill="#9fb0e8">우승 없이 동점 2위 행진 — 다음 경기 승리 시 준우승권 탈환 기회</text>
  </g>

  <!-- Three-body comic -->
  <g transform="translate(60,620)">
    <rect width="465" height="280" rx="24" fill="#16224e"/>
    <text x="36" y="56" font-family="sans-serif" font-size="30" font-weight="bold" fill="#7dd3fc">🎬 삼체 코믹</text>
    <text x="36" y="105" font-family="sans-serif" font-size="23" fill="#dfe6ff">008화 전송 누락 재발 → 즉시 반영·공개 200</text>
    <text x="36" y="150" font-family="sans-serif" font-size="23" fill="#dfe6ff">009화 전송 누락 재발 → 즉시 반영·공개 200</text>
    <text x="36" y="195" font-family="sans-serif" font-size="23" fill="#dfe6ff">연재는 공개 200 유지 — 흐름 끊김 없음</text>
    <text x="36" y="245" font-family="sans-serif" font-size="20" fill="#9fb0e8">반영 커밋 d9ee3ff · 5d871d2</text>
  </g>

  <!-- Auth/Ops -->
  <g transform="translate(555,620)">
    <rect width="465" height="280" rx="24" fill="#16224e"/>
    <text x="36" y="56" font-family="sans-serif" font-size="30" font-weight="bold" fill="#c4b5fd">🔐 인증 · 운영</text>
    <text x="36" y="105" font-family="sans-serif" font-size="23" fill="#dfe6ff">새벽 401 3회 — Claude OAuth 재발·.env 복귀</text>
    <text x="36" y="150" font-family="sans-serif" font-size="23" fill="#dfe6ff">유효 토큰 재동기화·200 확인으로 수습</text>
    <text x="36" y="195" font-family="sans-serif" font-size="23" fill="#dfe6ff">덮어쓴 주체 미상 — 추적 과제로 남김</text>
    <text x="36" y="245" font-family="sans-serif" font-size="20" fill="#9fb0e8">기존 안건 이어받아 처리</text>
  </g>

  <!-- Board -->
  <g transform="translate(60,930)">
    <rect width="465" height="250" rx="24" fill="#16224e"/>
    <text x="36" y="56" font-family="sans-serif" font-size="30" font-weight="bold" fill="#4ade80">🛠️ 게시판</text>
    <text x="36" y="105" font-family="sans-serif" font-size="23" fill="#dfe6ff">라이카 일일연구·경기 비평 ACK 완료</text>
    <text x="36" y="150" font-family="sans-serif" font-size="23" fill="#dfe6ff">11-12 판 비평 등록(FB-20261113-01)</text>
    <text x="36" y="195" font-family="sans-serif" font-size="23" fill="#dfe6ff">스캔-파일 불일치 확인(FB-20261111-04)</text>
  </g>

  <!-- Warning -->
  <g transform="translate(555,930)">
    <rect width="465" height="250" rx="24" fill="#3a1d2e" stroke="#f87171" stroke-width="2"/>
    <text x="36" y="56" font-family="sans-serif" font-size="30" font-weight="bold" fill="#f87171">⚠️ 코믹 전송 파이프라인</text>
    <text x="36" y="105" font-family="sans-serif" font-size="23" fill="#ffd6d6">006~009화 4화 연속 전송 누락 재발</text>
    <text x="36" y="150" font-family="sans-serif" font-size="23" fill="#ffd6d6">매번 즉시 수동 반영 — 근본 원인 남음</text>
    <text x="36" y="195" font-family="sans-serif" font-size="22" fill="#c9a0a0">파이프라인 수정은 지속 과제</text>
